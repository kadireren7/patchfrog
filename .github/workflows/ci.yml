name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patchfrog
          POSTGRES_PASSWORD: patchfrog
          POSTGRES_DB: patchfrog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchfrog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://patchfrog:patchfrog@localhost:5432/patchfrog
      REDIS_URL: redis://localhost:6379/0
      # A GitHub App identity is required for Settings to construct, not
      # for any real GitHub call CI makes -- every job below runs against
      # fixtures/oracle providers only, never live credentials.
      # GITHUB_PRIVATE_KEY below is a disposable RSA keypair generated
      # solely for this workflow (`openssl genrsa 2048`) -- never
      # registered with any real GitHub App, never used outside CI.
