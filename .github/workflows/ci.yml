name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patchfrog
          POSTGRES_PASSWORD: patchfrog
          POSTGRES_DB: patchfrog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchfrog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://patchfrog:patchfrog@localhost:5432/patchfrog
      REDIS_URL: redis://localhost:6379/0
      # A GitHub App identity is required for Settings to construct, not for
      # any real GitHub call CI makes -- every job below runs against
      # fixtures/oracle providers only, never live credentials.
      #
      # Secret-looking values are deliberately NOT written here: a job-level
      # `env:` block is printed, resolved, in the header of every step's log.
      # The disposable App key and webhook secret are generated at run time
      # by the "Generate disposable credentials" step below, written to a
      # file / $GITHUB_ENV, and masked. See tests/unit/test_ci_workflow_hygiene.py.
      GITHUB_APP_ID: "0"
      # The database-specific suite must fail if the declared CI service is
      # unavailable or unmigrated. Local runs may skip these tests when no
      # compatible Postgres is present.
      PATCHFROG_REQUIRE_POSTGRES: "1"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
      SEMGREP_SEND_METRICS: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Generate disposable credentials (written to a file, masked, never printed)
        run: |
          set +x
          umask 077
          key="$RUNNER_TEMP/ci-github-app-key.pem"
          openssl genrsa -out "$key" 2048 2>/dev/null
          # Belt and braces: if any later step ever echoed this key, the runner redacts it.
          while IFS= read -r line; do
            [ "${#line}" -ge 8 ] && echo "::add-mask::$line"
          done < "$key"
          chmod 0644 "$key"  # a disposable test key; the container user must be able to read the mounted file
          webhook_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$webhook_secret"
          {
            echo "GITHUB_PRIVATE_KEY_PATH=$key"
            echo "GITHUB_WEBHOOK_SECRET=$webhook_secret"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: Verify required static analyzers
        run: |
          ruff --version
          semgrep --version

      - name: mypy --strict
        run: mypy . --strict

      - name: Run migrations
        run: alembic upgrade head

      - name: Verify migration head matches alembic_version
        run: |
          expected=$(alembic heads | awk '{print $1}')
          actual=$(python -c "
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def main():
              engine = create_async_engine('$DATABASE_URL')
              async with engine.connect() as conn:
                  r = await conn.execute(text('SELECT version_num FROM alembic_version'))
                  print(r.first()[0])
              await engine.dispose()
          asyncio.run(main())
          ")
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: pytest
        run: pytest -q

      - name: Benchmark sanity (oracle provider, small case subset -- never the full corpus on every commit)
        run: |
          python -m patchfrog.cli eval run \
            --case py-auth-bypass --case py-path-traversal --case clean-py-defensive-check \
            --case secq-a-credential-log-exposure --case secq-n-safe-constant-time-compare \
            --output /tmp/ci_eval_sanity.json

      - name: Build Docker images (build-only, no push)
        run: |
          docker build -f docker/Dockerfile --target api -t patchfrog-api:ci .
          docker build -f docker/Dockerfile --target worker -t patchfrog-worker:ci .

      - name: Verify Celery task registration
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" -e REDIS_URL="$REDIS_URL" \
            -e GITHUB_APP_ID="$GITHUB_APP_ID" \
            -v "$GITHUB_PRIVATE_KEY_PATH:/run/ci-github-app-key.pem:ro" \
            -e GITHUB_PRIVATE_KEY_PATH=/run/ci-github-app-key.pem \
            -e GITHUB_WEBHOOK_SECRET \
            --network host \
            patchfrog-worker:ci python -c "
          from apps.worker.celery_app import celery_app
          import apps.worker.tasks
          tasks = [t for t in celery_app.tasks if not t.startswith('celery.')]
          assert len(tasks) == 9, f'expected 9 tasks, got {len(tasks)}: {sorted(tasks)}'
          print('OK:', sorted(tasks))
          "
