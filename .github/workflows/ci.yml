      GITHUB_WEBHOOK_SECRET: ci-placeholder-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy . --strict

      - name: Run migrations
        run: alembic upgrade head

      - name: Verify migration head matches alembic_version
        run: |
          expected=$(alembic heads | awk '{print $1}')
          actual=$(python -c "
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def main():
              engine = create_async_engine('$DATABASE_URL')
              async with engine.connect() as conn:
                  r = await conn.execute(text('SELECT version_num FROM alembic_version'))
                  print(r.first()[0])
              await engine.dispose()
          asyncio.run(main())
          ")
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: pytest
        run: pytest -q

      - name: Benchmark sanity (oracle provider, small case subset -- never the full corpus on every commit)
        run: |
          python -m patchfrog.cli eval run \
            --case py-auth-bypass --case py-path-traversal --case clean-py-defensive-check \
            --case secq-a-credential-log-exposure --case secq-n-safe-constant-time-compare \
            --output /tmp/ci_eval_sanity.json

      - name: Build Docker images (build-only, no push)
        run: |
          docker build -f docker/Dockerfile --target api -t patchfrog-api:ci .
          docker build -f docker/Dockerfile --target worker -t patchfrog-worker:ci .

      - name: Verify Celery task registration
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" -e REDIS_URL="$REDIS_URL" \
            -e GITHUB_APP_ID="$GITHUB_APP_ID" -e GITHUB_PRIVATE_KEY="$GITHUB_PRIVATE_KEY" \
            -e GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            --network host \
            patchfrog-worker:ci python -c "
          from apps.worker.celery_app import celery_app
          import apps.worker.tasks
          tasks = [t for t in celery_app.tasks if not t.startswith('celery.')]
          assert len(tasks) == 9, f'expected 9 tasks, got {len(tasks)}: {sorted(tasks)}'
          print('OK:', sorted(tasks))
          "
