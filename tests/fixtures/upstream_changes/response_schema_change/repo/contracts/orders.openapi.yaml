openapi: 3.0.3
info: {title: Orders API, version: "1.8.0"}
servers: [{url: "https://orders.internal.example"}]
paths:
  /v1/orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: ok
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/OrderSummary"}}}}
  /v1/orders/{id}:
    get:
      operationId: getOrder
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: ok
          content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}
components:
  schemas:
    OrderSummary:
      type: object
      properties: {id: {type: string}, status: {type: string}}
    Order:
      type: object
      required: [id]
      properties:
        id: {type: string}
        total: {type: integer}
        currency: {type: string}
