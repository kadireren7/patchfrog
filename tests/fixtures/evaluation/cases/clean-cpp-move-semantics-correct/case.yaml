  title: Move constructor and move assignment correctly null out the source
  description: >
    Buffer's move constructor and move-assignment operator both
    transfer ownership and null out the source's pointer, so its
    destructor becomes a safe no-op. Correct move semantics, not a
    double-free or ownership bug.
