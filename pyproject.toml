[project]
name = "patchfrog"
version = "0.1.0"
description = "GitHub-native AI code review platform (Phase 1: ingestion foundation)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.1,<6.0",
    "httpx>=0.27,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "structlog>=24.4,<25.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-c>=0.23,<1.0",
    "tree-sitter-cpp>=0.23,<1.0",
    # Static analysis engine (Phase 3): ruff and semgrep are invoked as
    # analyzer subprocesses at runtime, not just used to lint PatchFrog's
    # own source — both must be present outside a dev install too.
    # cppcheck/clang-tidy are external system binaries, not Python
    # packages, and are discovered at runtime by each adapter's own
    # discover() (see patchfrog.analysis.analyzers.cppcheck/clang_tidy)
    # rather than declared here.
    "ruff>=0.7,<1.0",
    "semgrep>=1.100,<2.0",
    "PyYAML>=6.0,<7.0",
    # AI Reviewer (Phase 5): official Anthropic SDK for the Claude API
    # provider adapter (patchfrog.review.providers.anthropic_provider).
    "anthropic>=0.68,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.13,<2.0",
    "respx>=0.21,<1.0",
    "aiosqlite>=0.20,<1.0",
    "types-redis",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
patchfrog = ["analysis/analyzers/semgrep_rules/*.yml"]

[tool.setuptools.packages.find]
include = ["patchfrog*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --ignore=tests/fixtures/repos"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/repos"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["patchfrog", "apps"]

[tool.mypy]
python_version = "3.12"
files = ["patchfrog", "apps", "tests"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "\\.venv/", "tests/fixtures/repos/"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
